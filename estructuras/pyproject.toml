[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "estructuras"
version = "0.1.0"
description = "Asistente de diseño estructural según el Reglamento Nacional de Edificaciones (Perú)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "ezdxf>=1.1", "matplotlib>=3.7", "numpy>=1.26", "python-docx>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
estructuras = "estructuras.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
estructuras = ["plantillas/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
